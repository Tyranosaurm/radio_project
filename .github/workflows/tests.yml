name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: Check runtime dependency imports
        run: python -c "from faster_whisper import WhisperModel; from shazamio import Shazam"
      - run: python -m unittest discover -s tests -v
      - run: radio-analyzer --help
